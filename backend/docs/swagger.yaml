definitions:
  database.Error:
    description: Ошибка
    properties:
      cause:
        type: string
      status_code:
        type: integer
    type: object
  database.Namespace:
    description: Неймспейс
    properties:
      admin:
        type: string
      description:
        type: string
      id:
        type: string
      members_count:
        type: integer
      picture:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  database.User:
    description: Основные данные профиля и связанные виджеты.
    properties:
      birth_date:
        type: string
      gender:
        type: string
      hide:
        type: boolean
      interests:
        items:
          type: string
        type: array
      location:
        type: string
      miniapp_name:
        type: string
      personality_test:
        items:
          type: number
        type: array
      tg_user:
        type: string
      user_info:
        type: string
      widgets:
        items:
          $ref: '#/definitions/database.Widget'
        type: array
    type: object
  database.Vote:
    description: Голос в опросе
    properties:
      option:
        type: integer
      survey:
        type: string
      user:
        type: string
    type: object
  database.Widget:
    description: Виджет
    properties:
      additionalData:
        type: string
      data:
        type: string
      id:
        type: string
      namespace:
        type: string
      order:
        type: integer
      user:
        $ref: '#/definitions/database.User'
      vote:
        $ref: '#/definitions/database.Vote'
    type: object
  handlers.AutocompleteResponse:
    properties:
      completions:
        items:
          $ref: '#/definitions/handlers.Autocompletion'
        type: array
    type: object
  handlers.Autocompletion:
    properties:
      similarity:
        type: number
      tag:
        type: string
    type: object
  handlers.CreatedNamespace:
    description: Ответ на успешное создание неймспейса
    properties:
      namespace_id:
        type: string
    type: object
  handlers.Games:
    description: Игры из steam профиля пользователя
    properties:
      games:
        items:
          $ref: '#/definitions/handlers.SteamGame'
        type: array
    type: object
  handlers.JWTTokens:
    description: Токены для авторизации и данные пользователя
    properties:
      auth_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/database.User'
    type: object
  handlers.NamespaceMember:
    properties:
      miniapp_name:
        type: string
      tg_user:
        type: string
    type: object
  handlers.NamespaceMembers:
    description: Данные неймспеса и его участники
    properties:
      namespace:
        $ref: '#/definitions/database.Namespace'
      users:
        items:
          $ref: '#/definitions/handlers.NamespaceMember'
        type: array
    type: object
  handlers.PageData:
    description: Данные анкеты (все поля database.User + tg username)
    properties:
      birth_date:
        type: string
      gender:
        type: string
      hide:
        type: boolean
      interests:
        items:
          type: string
        type: array
      location:
        type: string
      miniapp_name:
        type: string
      personality_test:
        items:
          type: number
        type: array
      tg_user:
        type: string
      user_info:
        type: string
      username:
        type: string
      widgets:
        items:
          $ref: '#/definitions/database.Widget'
        type: array
    type: object
  handlers.Photos:
    description: Изображение
    properties:
      files:
        items:
          items:
            format: int32
            type: integer
          type: array
        type: array
    type: object
  handlers.SteamGame:
    properties:
      appid:
        type: integer
      content_descriptorids:
        items:
          type: integer
        type: array
      has_community_visible_stats:
        type: boolean
      img_icon_url:
        type: string
      name:
        type: string
      playtime_forever:
        type: integer
    type: object
  handlers.UserNamespaces:
    description: Неймспейсы, в который состоит пользователь
    properties:
      namespaces:
        items:
          $ref: '#/definitions/database.Namespace'
        type: array
    type: object
info:
  contact: {}
  description: Shumi API
  title: Shumi API
  version: "1.0"
paths:
  /api/auth:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: Токен выдан
          schema:
            $ref: '#/definitions/handlers.JWTTokens'
        "401":
          description: Не валидный токен авторизации
          schema:
            $ref: '#/definitions/database.Error'
        "403":
          description: Пользователь не записан в базу данных
          schema:
            $ref: '#/definitions/database.Error'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      security:
      - TmaAuth: []
      summary: Получить токен авторизации
  /api/autocomplete:
    get:
      description: Возвращает список интересов, семантически похожих на запрос 'q'.
      parameters:
      - description: Строка для поиска и автодополнения интересов
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка интересов
          schema:
            $ref: '#/definitions/handlers.AutocompleteResponse'
        "401":
          description: Ошибка авторизации
          schema:
            $ref: '#/definitions/database.Error'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Предложенные интересы
  /api/files/{object}/{id}/{index}:
    get:
      parameters:
      - description: тип объекта (users, namespaces, widgets)
        in: path
        name: object
        required: true
        type: string
      - description: id объекта
        in: path
        name: id
        required: true
        type: string
      - description: индекс файла в списке файлов виджета
        in: path
        name: index
        type: string
        required: false
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Файл
          schema:
            type: file
        "403":
          description: Для этого пользователя нет доступа к файлу
          schema:
            $ref: '#/definitions/database.Error'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Получить фото, связанное с объектом
  /api/games:
    get:
      parameters:
      - description: Ссылка на профиль
        in: query
        name: link
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Игры из steam профиля пользователя
          schema:
            $ref: '#/definitions/handlers.Games'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Игры пользователя из его steam профиля для виджета
  /api/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.User'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/database.Error'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Профиль пользователя
    patch:
      consumes:
      - application/json
      parameters:
      - description: Имя пользователя
        in: body
        name: miniapp_name
        schema:
          type: string
      - description: Локация пользователя
        in: body
        name: location
        schema:
          type: string
      - description: Пол пользователя
        in: body
        name: gender
        schema:
          type: string
      - description: Дата рождения пользователя
        in: body
        name: birth_date
        schema:
          type: string
      - description: Информация о пользователе
        in: body
        name: info
        schema:
          type: string
      - description: Интересы о пользователе
        in: body
        name: interests
        schema:
          type: array
      - description: Личностный тест (5 слайдеров)
        in: body
        name: personality_test
        schema:
          type: array
      responses:
        "200":
          description: Пользователь успешно обновлен
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/database.Error'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Обновить информацию профиля пользователя
  /api/me/namespaces:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserNamespaces'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Неймспейсы пользователя
  /api/me/photo:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Фото пользователя
        in: body
        name: user_photo
        schema:
          items:
            type: integer
          type: array
      responses:
        "200":
          description: Пользователь успешно обновлен
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Обновить фото профиля пользователя
  /api/me/widgets:
    delete:
      parameters:
      - description: id виджета
        in: query
        name: widget_id
        required: true
        type: string
      responses:
        "200":
          description: Виджет удален
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Удалить виджет
    patch:
      consumes:
      - multipart/form-data
      parameters:
      - description: Данные виджета (JSON)
        in: formData
        name: data
        type: string
      - description: Файлы виджета
        in: formData
        name: files
        type: array
      responses:
        "200":
          description: Виджет успешно обновлен
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Обновить виджет
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Данные виджета
        in: formData
        name: data
        type: string
      - description: Файлы виджета
        in: formData
        name: files
        type: array
      responses:
        "200":
          description: Виджет успешно создан
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Создать виджет
  /api/me/widgets/order:
    patch:
      consumes:
      - multipart/form-data
      parameters:
      - description: id виджета
        in: formData
        name: widget_id
        required: true
        type: string
      - description: Изменение позиции виджета виджета
        in: formData
        name: order
        required: true
        type: integer
      responses:
        "200":
          description: Очередь успешно обновлена
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Обновить очередь виджета
  /api/me/widgets/photo:
    delete:
      parameters:
      - description: id виджета
        in: query
        name: widget_id
        required: true
        type: string
      - description: Позиция фото в списке
        in: query
        name: index
        required: true
        type: integer
      responses:
        "200":
          description: Фото виджета удалено
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Удалить фото виджета
  /api/namespace:
    delete:
      parameters:
      - description: Название неймспейса
        in: query
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Неймспейс успешно удален
        "403":
          description: Этот пользователь не админ неймспейса
          schema:
            $ref: '#/definitions/database.Error'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Удалить неймспейс
    patch:
      consumes:
      - multipart/form-data
      parameters:
      - description: Название неймспейса
        in: formData
        name: title
        type: string
      - description: Картинка неймспейса
        in: formData
        name: photo
        type: file
      - description: Описание неймспейса
        in: formData
        name: description
        type: string
      responses:
        "200":
          description: Неймспейс успешно обновлен
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Обновить информацию о неймспейсе
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Название неймспейса
        in: formData
        name: title
        required: true
        type: string
      - description: Картинка неймспейса
        in: formData
        name: photo
        required: true
        type: file
      - description: Описание неймспейса
        in: formData
        name: description
        required: true
        type: string
      responses:
        "200":
          description: Неймспейс успешно создан
          schema:
            $ref: '#/definitions/handlers.CreatedNamespace'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Создать неймспейс
  /api/namespace/{namespace_id}:
    delete:
      parameters:
      - description: id неймспейса
        in: query
        name: namespace
        required: true
        type: string
      responses:
        "200":
          description: Успешный вход
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Выйти из неймспейса
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: id неймспейса
        in: path
        name: namespace_id
        required: true
        type: string
      - description: инвайт код для входа в неймспейс
        in: formData
        name: invite_code
        required: true
        type: string
      responses:
        "200":
          description: Успешный вход
        "403":
          description: Неверный код входа
          schema:
            $ref: '#/definitions/database.Error'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Зайти в неймспейс
  /api/namespace/{namespace_id}/feed:
    get:
      parameters:
      - description: id неймспейса
        in: path
        name: namespace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.PageData'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Получить ленту из анкет пользователей неймспейса
  /api/namespace/{namespace_id}/pages:
    get:
      parameters:
      - description: id неймспейса
        in: path
        name: namespace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.NamespaceMembers'
        "403":
          description: Пользователь не участник этого неймспейса
          schema:
            $ref: '#/definitions/database.Error'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Получить пользователей неймспейса
  /api/pages/{page_id}:
    get:
      parameters:
      - description: id анкеты
        in: path
        name: page_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PageData'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Получить анкету(страницу) одного пользователя
  /api/tg:
    delete:
      parameters:
      - description: id пользователя
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Скрыть/показывать анкету другим пользователям
    get:
      parameters:
      - description: id пользователя
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.User'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Проверить существование пользователя в бд
    patch:
      parameters:
      - description: id пользователя
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Скрыть/показывать анкету другим пользователям
    post:
      parameters:
      - description: tg id пользователя
        in: body
        name: id
        required: true
        schema:
          type: string
      - description: tg username пользователя
        in: body
        name: username
        required: true
        schema:
          type: string
      - description: tg firstname пользователя
        in: body
        name: firstname
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Проверить существование пользователя в бд
  /api/vote:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: id виджета опроса
        in: formData
        name: survey
        type: string
      - description: вариант опроса
        in: formData
        name: option
        type: string
      responses:
        "200":
          description: Голос засчитан
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/database.Error'
      summary: Проголосовать в опросе
security:
- BearerAuth: []
securityDefinitions:
  BearerAuth:
    description: 'Введите: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
  TmaAuth:
    description: 'Введите: tma {data}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
