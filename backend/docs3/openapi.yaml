---
openapi: 3.0.1
info:
  title: Shumi API
  description: Shumi API
  contact: {}
  version: '1.0'
servers:
  - url: "/"
security:
  - BearerAuth: []
paths:
  "/api/auth":
    post:
      summary: Получить токен авторизации
      responses:
        '200':
          description: Токен выдан
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/handlers.JWTTokens"
        '401':
          description: Не валидный токен авторизации
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
        '403':
          description: Пользователь не записан в базу данных
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
      security:
        - TmaAuth: []
  "/api/autocomplete":
    get:
      summary: Предложенные интересы
      description: Возвращает список интересов, семантически похожих на запрос 'q'.
      parameters:
        - name: q
          in: query
          description: Строка для поиска и автодополнения интересов
          schema:
            type: string
      responses:
        '200':
          description: Успешное получение списка интересов
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/handlers.AutocompleteResponse"
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/files/{object}/{id}/{index}":
    get:
      summary: Получить фото, связанное с объектом
      parameters:
        - name: object
          in: path
          description: тип объекта (users, namespaces, widgets)
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: id объекта
          required: true
          schema:
            type: string
        - name: index
          in: path
          description: индекс файла в списке файлов виджета
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Файл
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Для этого пользователя нет доступа к файлу
          content:
            application/octet-stream:
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/octet-stream:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/games":
    get:
      summary: Игры пользователя из его steam профиля для виджета
      parameters:
        - name: link
          in: query
          description: Ссылка на профиль
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Игры из steam профиля пользователя
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/handlers.Games"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/me":
    get:
      summary: Профиль пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.User"
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
    patch:
      summary: Обновить информацию профиля пользователя
      requestBody:
        description: новые данные пользователя в JSON
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/database.User"
        required: true
      responses:
        '200':
          description: Пользователь успешно обновлен
          content: {}
        '401':
          description: Пользователь не авторизован
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
      x-codegen-request-body-name: date
  "/api/me/namespaces":
    get:
      summary: Неймспейсы пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/handlers.UserNamespaces"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/me/photo":
    patch:
      summary: Обновить фото профиля пользователя
      requestBody:
        description: Фото пользователя
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
        required: false
      responses:
        '200':
          description: Пользователь успешно обновлен
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
      x-codegen-request-body-name: user_photo
  "/api/me/widgets":
    post:
      summary: Создать виджет
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: Данные виджета
                files:
                  type: array
                  description: Файлы виджета
                  items:
                    type: array
                    items:
                      type: integer
      responses:
        '200':
          description: Виджет успешно создан
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    delete:
      summary: Удалить виджет
      parameters:
        - name: widget_id
          in: query
          description: id виджета
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Виджет удален
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    patch:
      summary: Обновить виджет
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: Данные виджета (JSON)
                files:
                  type: array
                  description: Файлы виджета
                  items:
                    type: array
                    items:
                      type: integer
      responses:
        '200':
          description: Виджет успешно обновлен
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/me/widgets/order":
    patch:
      summary: Обновить очередь виджета
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - order
                - widget_id
              type: object
              properties:
                widget_id:
                  type: string
                  description: id виджета
                order:
                  type: integer
                  description: Изменение позиции виджета виджета
                  format: int32
        required: true
      responses:
        '200':
          description: Очередь успешно обновлена
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/me/widgets/photo":
    delete:
      summary: Удалить фото виджета
      parameters:
        - name: widget_id
          in: query
          description: id виджета
          required: true
          schema:
            type: string
        - name: index
          in: query
          description: Позиция фото в списке
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Фото виджета удалено
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/namespace":
    post:
      summary: Создать неймспейс
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - description
                - photo
                - title
              type: object
              properties:
                title:
                  type: string
                  description: Название неймспейса
                photo:
                  type: string
                  description: Картинка неймспейса
                  format: binary
                description:
                  type: string
                  description: Описание неймспейса
        required: true
      responses:
        '200':
          description: Неймспейс успешно создан
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/handlers.CreatedNamespace"
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    delete:
      summary: Удалить неймспейс
      parameters:
        - name: id
          in: query
          description: Название неймспейса
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Неймспейс успешно удален
          content: {}
        '403':
          description: Этот пользователь не админ неймспейса
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    patch:
      summary: Обновить информацию о неймспейсе
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: id неймспейса
                title:
                  type: string
                  description: Название неймспейса
                photo:
                  type: string
                  description: Картинка неймспейса
                  format: binary
                description:
                  type: string
                  description: Описание неймспейса
      responses:
        '200':
          description: Неймспейс успешно обновлен
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/namespace/{namespace_id}":
    post:
      summary: Зайти в неймспейс
      parameters:
        - name: namespace_id
          in: path
          description: id неймспейса
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - invite_code
              type: object
              properties:
                invite_code:
                  type: string
                  description: инвайт код для входа в неймспейс
        required: true
      responses:
        '200':
          description: Успешный вход
          content: {}
        '403':
          description: Неверный код входа
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    delete:
      summary: Выйти из неймспейса
      parameters:
        - name: namespace_id
          in: path
          description: id неймспейса
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Успешный вход
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/namespace/{namespace_id}/feed":
    get:
      summary: Получить ленту из анкет пользователей неймспейса
      parameters:
        - name: namespace_id
          in: path
          description: id неймспейса
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/handlers.PageData"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/namespace/{namespace_id}/pages":
    get:
      summary: Получить пользователей неймспейса
      parameters:
        - name: namespace_id
          in: path
          description: id неймспейса
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/handlers.NamespaceMembers"
        '403':
          description: Пользователь не участник этого неймспейса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/pages/{page_id}":
    get:
      summary: Получить анкету(страницу) одного пользователя
      parameters:
        - name: page_id
          in: path
          description: id анкеты
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/handlers.PageData"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/tg":
    get:
      summary: Проверить существование пользователя в бд
      parameters:
        - name: id
          in: query
          description: id пользователя
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/database.User"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
    post:
      summary: Проверить существование пользователя в бд
      requestBody:
        description: tg firstname пользователя
        content:
          "*/*":
            schema:
              type: string
        required: true
      responses:
        '200':
          description: OK
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
      x-codegen-request-body-name: firstname
    delete:
      summary: Скрыть/показывать анкету другим пользователям
      parameters:
        - name: id
          in: query
          description: id пользователя
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
    patch:
      summary: Скрыть/показывать анкету другим пользователям
      parameters:
        - name: id
          in: query
          description: id пользователя
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/tg/namespace/add":
    post:
      summary: Записать пользоватея в неймспейс
      requestBody:
        description: данные для записи пользователя
        content:
          "*/*":
            schema:
              "$ref": "#/components/schemas/handlers.TgEnterNamespaceData"
        required: true
      responses:
        '200':
          description: OK
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
      x-codegen-request-body-name: data
  "/api/tg/namespace/create":
    post:
      summary: Записать пользоватея в неймспейс
      requestBody:
        description: данные для записи пользователя
        content:
          "*/*":
            schema:
              "$ref": "#/components/schemas/handlers.TgEnterNamespaceData"
        required: true
      responses:
        '200':
          description: OK
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
      x-codegen-request-body-name: data
  "/api/vote":
    post:
      summary: Проголосовать в опросе
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                survey:
                  type: string
                  description: id виджета опроса
                option:
                  type: string
                  description: вариант опроса
      responses:
        '200':
          description: Голос засчитан
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
components:
  schemas:
    database.Error:
      type: object
      properties:
        cause:
          type: string
        status_code:
          type: integer
      description: Ошибка
    database.Interest:
      type: object
      properties:
        id:
          type: string
        tag:
          type: string
      description: Интерес
    database.Namespace:
      type: object
      properties:
        admin:
          type: string
        description:
          type: string
        id:
          type: string
        members_count:
          type: integer
        title:
          type: string
      description: Неймспейс
    database.User:
      type: object
      properties:
        birth_date:
          type: string
        gender:
          type: string
        hide:
          type: boolean
        interests:
          type: array
          items:
            "$ref": "#/components/schemas/database.Interest"
        location:
          type: string
        miniapp_name:
          type: string
        personality_test:
          type: array
          items:
            type: number
        tg_user:
          type: string
        user_info:
          type: string
        widgets:
          type: array
          items:
            "$ref": "#/components/schemas/database.Widget"
      description: Основные данные профиля и связанные виджеты.
    database.Vote:
      type: object
      properties:
        option:
          type: integer
        survey:
          type: string
        user:
          type: string
      description: Голос в опросе
    database.Widget:
      type: object
      properties:
        additionalData:
          type: string
        data:
          type: string
        id:
          type: string
        namespace:
          type: string
        order:
          type: integer
        user:
          "$ref": "#/components/schemas/database.User"
        vote:
          "$ref": "#/components/schemas/database.Vote"
      description: Виджет
    handlers.AutocompleteResponse:
      type: object
      properties:
        completions:
          type: array
          items:
            "$ref": "#/components/schemas/handlers.InterestSimilarity"
    handlers.CreatedNamespace:
      type: object
      properties:
        invite_code:
          type: string
        namespace_id:
          type: string
      description: Ответ на успешное создание неймспейса
    handlers.Games:
      type: object
      properties:
        games:
          type: array
          items:
            "$ref": "#/components/schemas/handlers.SteamGame"
      description: Игры из steam профиля пользователя
    handlers.InterestSimilarity:
      type: object
      properties:
        id:
          type: string
        similarity:
          type: number
        tag:
          type: string
    handlers.JWTTokens:
      type: object
      properties:
        auth_token:
          type: string
        refresh_token:
          type: string
        user:
          "$ref": "#/components/schemas/database.User"
      description: Токены для авторизации и данные пользователя
    handlers.NamespaceMember:
      type: object
      properties:
        date:
          type: string
        miniapp_name:
          type: string
        tg_user:
          type: string
    handlers.NamespaceMembers:
      type: object
      properties:
        namespace:
          "$ref": "#/components/schemas/database.Namespace"
        users:
          type: array
          items:
            "$ref": "#/components/schemas/handlers.NamespaceMember"
      description: Данные неймспеса и его участники
    handlers.PageData:
      type: object
      properties:
        birth_date:
          type: string
        gender:
          type: string
        hide:
          type: boolean
        info_score:
          type: number
        interests:
          type: array
          items:
            "$ref": "#/components/schemas/handlers.InterestSimilarity"
        interests_score:
          type: number
        location:
          type: string
        miniapp_name:
          type: string
        personality_score:
          type: number
        personality_test:
          type: array
          items:
            type: number
        similarity:
          type: number
        tg_user:
          type: string
        user_info:
          type: string
        username:
          type: string
        widgets:
          type: array
          items:
            "$ref": "#/components/schemas/database.Widget"
      description: Данные анкеты (все поля database.User + tg username)
    handlers.SteamGame:
      type: object
      properties:
        appid:
          type: integer
        content_descriptorids:
          type: array
          items:
            type: integer
        has_community_visible_stats:
          type: boolean
        img_icon_url:
          type: string
        name:
          type: string
        playtime_forever:
          type: integer
    handlers.TgEnterNamespaceData:
      type: object
      properties:
        namespace_id:
          type: string
        user_id:
          type: string
    handlers.UserNamespaces:
      type: object
      properties:
        namespaces:
          type: array
          items:
            "$ref": "#/components/schemas/database.Namespace"
      description: Неймспейсы, в который состоит пользователь
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    TmaAuth:
