---
openapi: 3.0.1
info:
  title: Shumi API
  description: Shumi API
  contact: {}
  version: '1.0'
security:
- bearerAuth: []
servers:
- url: "/"
paths:
  "/api/auth":
    post:
      summary: Получить токен авторизации
      security:
      - tmaAuth: []
      requestBody:
        description: tma initData
        content:
          "*/*":
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Токен выдан
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Не валидный токен авторизации
          content:
            application/json:
              schema:
                type: string
        '403':
          description: Пользователь не записан в базу данных
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: string
      x-codegen-request-body-name: initData
  "/api/games":
    get:
      summary: Игры пользователя из его steam профиля для виджета
      parameters:
      - name: link
        in: query
        description: Ссылка на профиль
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON, содержащий список игр
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/me":
    get:
      summary: Профиль пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.User"
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
    patch:
      summary: Обновить информацию профиля пользователя
      requestBody:
        description: Интересы о пользователе
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        required: false
      responses:
        '200':
          description: Пользователь успешно обновлен
          content: {}
        '401':
          description: Пользователь не авторизован
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
      x-codegen-request-body-name: interests
  "/api/me/namespaces":
    get:
      summary: Неймспейсы пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/handlers.UserNamespaces"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/me/photo":
    post:
      summary: Обновить информацию профиля пользователя
      requestBody:
        description: Фото пользователя
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
        required: false
      responses:
        '200':
          description: Пользователь успешно обновлен
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
      x-codegen-request-body-name: user_photo
  "/api/me/widgets":
    post:
      summary: Создать виджет
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: array
                  description: Данные виджета
                  items:
                    type: integer
                    format: int32
                files:
                  type: array
                  description: Файлы виджета
                  items:
                    type: array
                    items:
                      type: integer
                      format: int32
      responses:
        '200':
          description: Виджет успешно создан
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    delete:
      summary: Удалить виджет
      parameters:
      - name: widget_id
        in: query
        description: id виджета
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Виджет удален
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    patch:
      summary: Обновить виджет
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: array
                  description: Данные виджета
                  items:
                    type: integer
                    format: int32
                files:
                  type: array
                  description: Файлы виджета
                  items:
                    type: array
                    items:
                      type: integer
                      format: int32
      responses:
        '200':
          description: Виджет успешно обновлен
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/me/widgets/order":
    patch:
      summary: Обновить очередь виджета
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - order
              - widget_id
              type: object
              properties:
                widget_id:
                  type: string
                  description: id виджета
                order:
                  type: integer
                  description: Изменение позиции виджета виджета
                  format: int32
        required: true
      responses:
        '200':
          description: Очередь успешно обновлена
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/me/widgets/photo":
    delete:
      summary: Удалить фото виджета
      parameters:
      - name: widget_id
        in: query
        description: id виджета
        required: true
        schema:
          type: string
      - name: index
        in: query
        description: Позиция фото в списке
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Фото виджета удалено
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/namespace":
    post:
      summary: Создать неймспейс
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - description
              - photo
              - title
              type: object
              properties:
                title:
                  type: string
                  description: Название неймспейса
                photo:
                  type: string
                  description: Картинка неймспейса
                  format: binary
                description:
                  type: string
                  description: Описание неймспейса
        required: true
      responses:
        '200':
          description: Неймспейс успешно создан
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    delete:
      summary: Удалить неймспейс
      parameters:
      - name: id
        in: query
        description: Название неймспейса
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Неймспейс успешно удален
          content: {}
        '403':
          description: Этот пользователь не админ неймспейса
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    patch:
      summary: Обновить информацию о неймспейсе
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Название неймспейса
                photo:
                  type: string
                  description: Картинка неймспейса
                  format: binary
                description:
                  type: string
                  description: Описание неймспейса
      responses:
        '200':
          description: Неймспейс успешно обновлен
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/namespace/{namespace_id}":
    post:
      summary: Зайти в неймспейс
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - invite_code
              - namespace
              type: object
              properties:
                namespace:
                  type: string
                  description: id неймспейса
                invite_code:
                  type: string
                  description: инвайт код для входа в неймспейс
        required: true
      responses:
        '200':
          description: Успешный вход
          content: {}
        '403':
          description: Неверный код входа
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
    delete:
      summary: Выйти из неймспейса
      parameters:
      - name: namespace
        in: query
        description: id неймспейса
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Успешный вход
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/namespace/{namespace_id}/feed":
    get:
      summary: Получить ленту из анкет пользователей неймспейса
      parameters:
      - name: namespace_id
        in: path
        description: id неймспейса
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/handlers.PageData"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/namespace/{namespace_id}/pages":
    get:
      summary: Получить ленту из анкет пользователей неймспейса
      parameters:
      - name: namespace_id
        in: path
        description: id неймспейса
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/handlers.NamespaceMembers"
        '403':
          description: Пользователь не участник этого неймспейса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/pages/{page_id}":
    get:
      summary: Получить анкету(страницу) одного пользователя
      parameters:
      - name: page_id
        in: path
        description: id анкеты
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/handlers.PageData"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/tg":
    get:
      summary: Проверить существование пользователя в бд
      parameters:
      - name: id
        in: query
        description: id пользователя
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/database.User"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
    post:
      summary: Проверить существование пользователя в бд
      requestBody:
        description: tg firstname пользователя
        content:
          "*/*":
            schema:
              type: string
        required: true
      responses:
        '200':
          description: OK
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
      x-codegen-request-body-name: firstname
    delete:
      summary: Скрыть/показывать анкету другим пользователям
      parameters:
      - name: id
        in: query
        description: id пользователя
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
    patch:
      summary: Скрыть/показывать анкету другим пользователям
      parameters:
      - name: id
        in: query
        description: id пользователя
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/vote":
    post:
      summary: Проголосовать в опросе
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                survey:
                  type: string
                  description: id виджета опроса
                option:
                  type: string
                  description: вариант опроса
      responses:
        '200':
          description: Голос засчитан
          content: {}
        '500':
          description: Внутренняя ошибка сервера
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/database.Error"
  "/api/worker/autocomplete":
    get:
      summary: Предложенные пользователю интересы
      parameters:
      - name: q
        in: query
        description: Ввод пользователя
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/handlers.AutocompleteResponse"
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/database.Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tmaAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Введите токен в формате: **tma <your_token>**'
  schemas:
    database.Error:
      type: object
      properties:
        cause:
          type: string
        status_code:
          type: integer
      description: Ошибка
    database.Namespace:
      description: Неймспейс
      type: object
      properties:
        admin:
          type: string
        description:
          type: string
        id:
          type: string
        picture:
          type: array
          items:
            type: integer
        title:
          type: string
    database.User:
      type: object
      properties:
        birth_date:
          type: string
        gender:
          type: string
        hide:
          type: boolean
        interests:
          type: array
          items:
            type: string
        location:
          type: string
        miniapp_name:
          type: string
        personality_test:
          type: array
          items:
            type: integer
        tg_user:
          type: string
        user_info:
          type: string
        user_photo:
          type: array
          items:
            type: integer
        widgets:
          type: array
          items:
            "$ref": "#/components/schemas/database.Widget"
      description: Основные данные профиля и связанные виджеты.
    database.Vote:
      type: object
      properties:
        option:
          type: integer
        survey:
          type: string
        user:
          type: string
      description: Голос в опросе
    database.Widget:
      type: object
      properties:
        additionalData:
          type: string
        data:
          type: string
        files:
          type: array
          items:
            type: array
            items:
              type: integer
              format: int32
        id:
          type: string
        namespace:
          type: string
        order:
          type: integer
        user:
          "$ref": "#/components/schemas/database.User"
        vote:
          "$ref": "#/components/schemas/database.Vote"
      description: Виджет
    handlers.AutocompleteResponse:
      type: object
      properties:
        q:
          type: string
        response:
          type: array
          items:
            type: string
      description: Ответ autocomplete эндпоинта воркера.
    handlers.NamespaceMembers:
      description: Данные неймспеса и его участники
      type: object
      properties:
        namespace:
          "$ref": "#/components/schemas/database.Namespace"
        user_ids:
          type: array
          items:
            type: string
    handlers.PageData:
      type: object
      properties:
        birth_date:
          type: string
        gender:
          type: string
        hide:
          type: boolean
        interests:
          type: array
          items:
            type: string
        location:
          type: string
        miniapp_name:
          type: string
        personality_test:
          type: array
          items:
            type: integer
        tg_user:
          type: string
        user_info:
          type: string
        user_photo:
          type: array
          items:
            type: integer
        username:
          type: string
        widgets:
          type: array
          items:
            "$ref": "#/components/schemas/database.Widget"
      description: Данные анкеты (все поля database.User + tg username)
    handlers.UserNamespaces:
      type: object
      properties:
        namespaces:
          type: array
          items:
            "$ref": "#/components/schemas/database.Namespace"
      description: Неймспейсы, в который состоит пользователь
x-original-swagger-version: '2.0'
